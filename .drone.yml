build:
  ci:
    image: kerneltime/vibauthor-and-go:0.3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ritesh/.ssh:/root/.ssh/
    environment:
      - GOVC_USERNAME=root
      - GOVC_PASSWORD=
      - GOVC_INSECURE=1
      - GOVC_URL=192.168.109.2
    commands:
      - make
      - export VM1=`govc vm.ip ubuntu`
      - export VM2=`govc vm.ip ubuntu-2`
      - ./hack/setup.sh $GOVC_URL $VM1 $VM2 < /dev/null
      - make test
      - ./hack/end2end.sh $GOVC_URL $VM1 $VM2 $$BUILD_NUMBER < /dev/null
    when :
      event: [push, tag]

  codereview:
    image: kerneltime/vibauthor-and-go:0.3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - ./logit.sh make
      - ./logit.sh "make test"
      - ./logit.sh "ping -c 1 192.168.109.2"
      - ./logit.sh "ssh 192.168.109.2 ls"
      - cat run.log
    when :
      event: pull_request

publish:
  docker:
    username: $$DOCKER_USER
    password: $$DOCKER_PASS
    email: $$DOCKER_EMAIL
    repo: kerneltime/docker-vmdk-plugin
    tag: "$$BRANCH-$$BUILD_NUMBER"
    file: Dockerfile.vmdk-plugin.debug
    privileged: true
    storage_driver: overlay
    when:
      branch: "!master"

  docker:
    username: $$DOCKER_USER
    password: $$DOCKER_PASS
    email: $$DOCKER_EMAIL
    repo: kerneltime/docker-vmdk-plugin
    tag: latest
    file: Dockerfile.vmdk-plugin
    privileged: true
    storage_driver: overlay
    when:
      branch: master
