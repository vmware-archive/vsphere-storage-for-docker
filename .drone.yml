build:
  ci:
    image: kerneltime/vibauthor-and-go:0.3
    volumes:
      # For Drone exec pass in the ssh keys if needed.
      # drone exec --trusted
      #- /home/<user>/.ssh:/root/.ssh/
    environment:
      - GOVC_USERNAME=$$CI_VMWARE_ESX_USER
      - GOVC_PASSWORD=$$CI_VMWARE_ESX_PASS
      - GOVC_INSECURE=1
      - GOVC_URL=$$CI_ESX_IP
    commands:
      - export VM1=`govc vm.ip ubuntu`
      - export VM2=`govc vm.ip ubuntu-2`
      - make
      - make test
      - ./hack/setup.sh $GOVC_URL $VM1 $VM2 $$BUILD_NUMBER < /dev/null
      - ./hack/end2end.sh $GOVC_URL $VM1 $VM2 $$BUILD_NUMBER < /dev/null

publish:
  docker:
    username: $$DOCKER_USER
    password: $$DOCKER_PASS
    email: $$DOCKER_EMAIL
    repo: kerneltime/docker-vmdk-plugin
    tag: "$$BRANCH-$$BUILD_NUMBER"
    file: Dockerfile.vmdk-plugin.debug
    privileged: true
    storage_driver: overlay
    when:
      branch: "!master"

  docker:
    username: $$DOCKER_USER
    password: $$DOCKER_PASS
    email: $$DOCKER_EMAIL
    repo: kerneltime/docker-vmdk-plugin
    tag: latest
    file: Dockerfile.vmdk-plugin
    privileged: true
    storage_driver: overlay
    when:
      branch: master
